plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aliitech.crossy'
    compileSdk 34

    defaultConfig {
        applicationId "com.aliitech.crossy"
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName "1.0." + (System.getenv("VERSION_CODE") ?: "0")
    }

    signingConfigs {
        release {
            // fixed signing key so new versions install over old ones
            storeFile file("crossy.keystore")
            storePassword "crossy2026"
            keyAlias "crossy"
            keyPassword "crossy2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
